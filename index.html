<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seam — Training Data for Robotic Cable Manipulation</title>
  <meta property="og:title" content="Seam — Training Data for Robotic Cable Manipulation" />
  <meta property="og:description" content="We're building the missing dataset for cable manipulation. Join us early." />
  <meta property="og:url" content="https://createwithseam.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://getlaunchlist.com/js/widget.js" defer></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F2EDE8; width: 100vw; height: 100vh;
      overflow: hidden; font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; }

    .logo {
      position: fixed; top: 20px; left: 28px; z-index: 10;
      text-decoration: none; opacity: 0.75; transition: opacity .2s;
    }
    .logo:hover { opacity: 1; }
    .logo img { height: 32px; width: auto; display: block; mix-blend-mode: multiply; }

    .headline-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; text-align: center;
      padding: 80px 32px 60px;
      background: linear-gradient(to top, transparent 0%, rgba(242,237,232,0.70) 40%, rgba(242,237,232,0.97) 80%);
      opacity: 0;
      animation: fadeDown .9s cubic-bezier(0.22,1,0.36,1) 1s forwards;
    }
    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-12px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .overlay {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 110px 32px 52px;
      background: linear-gradient(to bottom, transparent 0%, rgba(242,237,232,0.72) 30%, rgba(242,237,232,0.97) 58%);
      gap: 14px; opacity: 0;
      animation: fadeUp .9s cubic-bezier(0.22,1,0.36,1) 1s forwards;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    h1 {
      font-family: 'DM Mono', monospace; font-size: clamp(22px, 3vw, 42px);
      font-weight: 400; color: #1A1A1A; letter-spacing: -0.025em; line-height: 1.2;
    }
    p.sub {
      font-size: 15px; font-weight: 500; color: rgba(0,0,0,0.70);
      letter-spacing: 0.01em;
    }

    /* ── Launchlist widget overrides ─────────────────────────── */
    .launchlist-widget input[type="email"] {
      font-family: 'DM Sans', sans-serif !important;
      background: rgba(0,0,0,0.04) !important;
      border: 1px solid rgba(0,0,0,0.12) !important;
      border-radius: 6px !important;
      color: #1A1A1A !important;
      font-size: 14px !important;
    }
    .launchlist-widget button,
    .launchlist-widget input[type="submit"] {
      font-family: 'DM Sans', sans-serif !important;
      background: #1A1A1A !important;
      color: #F2EDE8 !important;
      border: none !important;
      border-radius: 6px !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      transition: background .15s !important;
    }
    .launchlist-widget button:hover,
    .launchlist-widget input[type="submit"]:hover {
      background: #333 !important;
    }
    form { display: flex; gap: 8px; margin-top: 6px; }
    input[type="email"] {
      width: 230px; height: 44px; padding: 0 16px;
      background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.12);
      border-radius: 6px; color: #1A1A1A;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: background .15s, border-color .15s;
    }
    input::placeholder { color: rgba(0,0,0,0.28); }
    input:focus { background: rgba(0,0,0,0.06); border-color: rgba(0,50,200,0.50); }
    button {
      height: 44px; padding: 0 22px; background: #1A1A1A; color: #F2EDE8;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      border: none; border-radius: 6px; cursor: pointer; white-space: nowrap;
      transition: background .15s, transform .1s;
    }
    button:hover  { background: #333; }
    button:active { transform: scale(.97); }
    .success { display: none; align-items: center; gap: 10px; animation: fadeUp .35s ease forwards; }
    .success.show { display: flex; }
    .ring {
      width: 34px; height: 34px; border-radius: 50%; background: #1A1A1A;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .ring svg { stroke: #F2EDE8; }
    .success p { font-size: 14px; color: rgba(0,0,0,.45); }
    footer {
      position: fixed; bottom: 18px; right: 24px; z-index: 10;
      font-size: 11px; color: rgba(0,0,0,.15); font-family: 'DM Mono', monospace;
    }
    @media (max-width: 600px) {
      form { flex-direction: column; width: 100%; max-width: 300px; }
      input[type="email"] { width: 100%; }
    }
  </style>
</head>
<body>

  <a class="logo" href="#">
    <img src="assets/seam-logo.png" alt="Seam" />
  </a>
  <canvas id="c"></canvas>

  <div class="headline-top">
    <h1>The missing dataset<br>for cable manipulation.</h1>
  </div>

  <div class="overlay">
    <p class="sub">We're building it. Join us early.</p>
    <div class="launchlist-widget" data-key-id="hLyge5" data-height="180px"></div>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <script>
  if (typeof THREE === 'undefined') {
    document.getElementById('c').style.display = 'none';
    console.error('Three.js failed to load');
  }


  if (typeof THREE !== 'undefined') {

  // ── RENDERER ──────────────────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  const BG = 0xF2EDE8;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.FogExp2(BG, 0.006);

  // ── CAMERA ────────────────────────────────────────────────────────────────
  const cam = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 80);
  cam.position.set(-4.0, 4.0, 28.0);
  cam.lookAt(0, 0, 0);

  // ── LIGHTS ────────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xffffff, 1.8));

  const key = new THREE.DirectionalLight(0xFFF8F0, 6);
  key.position.set(5, 10, 8);
  scene.add(key);

  const fill = new THREE.PointLight(0xE8DDD0, 4, 30);
  fill.position.set(-8, 2, 6);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xDDDDEE, 3);
  rim.position.set(-3, 6, -8);
  scene.add(rim);

  const cableGlowLight = new THREE.PointLight(0xFF3300, 2, 10);
  scene.add(cableGlowLight);

  // ── MATERIALS ─────────────────────────────────────────────────────────────
  const MAT = {
    frame: new THREE.MeshStandardMaterial({ color: 0x1C1C24, metalness: 0.90, roughness: 0.10 }),
    body:  new THREE.MeshStandardMaterial({ color: 0x28282F, metalness: 0.82, roughness: 0.18 }),
    gripFace: new THREE.MeshStandardMaterial({
      color: 0xDDDDE8, metalness: 0.10, roughness: 0.65,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -8,
    }),
    bolt: new THREE.MeshStandardMaterial({ color: 0x111118, metalness: 0.95, roughness: 0.05 }),
    cable: new THREE.MeshStandardMaterial({
      color: 0xCC0000, metalness: 0.0, roughness: 0.40,
      emissive: new THREE.Color(0xCC0000), emissiveIntensity: 0.8,
    }),
    cableGlow: new THREE.MeshBasicMaterial({
      color: 0xFF0000, transparent: true, opacity: 0.18,
      side: THREE.BackSide, depthWrite: false,
      blending: THREE.AdditiveBlending,
    }),
    cableEnd: new THREE.MeshStandardMaterial({
      color: 0xFF1100, emissive: new THREE.Color(0xFF1100), emissiveIntensity: 1.2,
    }),
  };

  // ── HELPERS ───────────────────────────────────────────────────────────────
  function mkBox(w, h, d, mat, x, y, z) {
    x=x||0; y=y||0; z=z||0;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); return m;
  }
  function mkCyl(rt, rb, h, seg, mat, x, y, z, rx, ry, rz) {
    x=x||0; y=y||0; z=z||0; rx=rx||0; ry=ry||0; rz=rz||0;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m;
  }
  function mkWedge(length, height, depth, mat) {
    const shape = new THREE.Shape();
    shape.moveTo(-length/2, 0);
    shape.lineTo( length/2, 0);
    shape.lineTo( 0, -height);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
    geo.translate(0, 0, -depth/2);
    return new THREE.Mesh(geo, mat);
  }

  // ── GRIPPER ───────────────────────────────────────────────────────────────
  const grip = new THREE.Group();
  grip.scale.set(1.6, 1.6, 1.6);
  scene.add(grip);

  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8,  0.55, -0.32));
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8, -0.55, -0.32));
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8,  0.55,  0.32));
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8, -0.55,  0.32));
  grip.add(mkBox(0.16, 1.26, 0.74, MAT.frame,  1.5,  0, 0));
  grip.add(mkBox(0.16, 1.26, 0.74, MAT.frame,  2.8,  0, 0));
  grip.add(mkBox(0.16, 1.26, 0.74, MAT.frame,  4.1,  0, 0));
  grip.add(mkBox(1.30, 1.40, 0.95, MAT.body,   0.50, 0, 0));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.05,  0.50, 0.52));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.95,  0.50, 0.52));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.05, -0.50, 0.52));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.95, -0.50, 0.52));

  // ─── WRIST MOUNT — caps the arm's right end so it reads as attached ────
  // Thick flange ring
  grip.add(mkCyl(0.72, 0.72, 0.30, 24, MAT.body,   5.50, 0, 0,  0, 0, Math.PI/2));
  // Inner collar
  grip.add(mkCyl(0.46, 0.46, 0.44, 20, MAT.frame,  5.62, 0, 0,  0, 0, Math.PI/2));
  // Bolt ring (4 bolts around the flange)
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    grip.add(mkCyl(0.045, 0.045, 0.32, 8, MAT.bolt,
      5.50, Math.cos(a) * 0.56, Math.sin(a) * 0.56,  0, 0, Math.PI/2));
  }

  const fingerLen = 1.80, fingerH = 0.70, fingerD = 1.10;
  const gapClosed = 0.12, gapOpen = 0.55;

  const upperFinger   = mkWedge(fingerLen, fingerH, fingerD, MAT.body);
  upperFinger.position.set(-0.30, gapClosed + fingerH, 0);
  grip.add(upperFinger);

  const upperGripFace = mkBox(fingerLen * 0.45, 0.07, fingerD + 0.02, MAT.gripFace);
  upperGripFace.position.set(-0.30, gapClosed + 0.035, 0);
  grip.add(upperGripFace);

  const lowerFinger   = mkWedge(fingerLen, fingerH, fingerD, MAT.body);
  lowerFinger.rotation.z = Math.PI;
  lowerFinger.position.set(-0.30, -(gapClosed + fingerH), 0);
  grip.add(lowerFinger);

  const lowerGripFace = mkBox(fingerLen * 0.45, 0.07, fingerD + 0.02, MAT.gripFace);
  lowerGripFace.position.set(-0.30, -(gapClosed + 0.035), 0);
  grip.add(lowerGripFace);

  const upperBracket = mkBox(0.30, 0.35, fingerD + 0.16, MAT.frame,  0.40, gapClosed + fingerH * 0.55, 0);
  const lowerBracket = mkBox(0.30, 0.35, fingerD + 0.16, MAT.frame,  0.40, -(gapClosed + fingerH * 0.55), 0);
  grip.add(upperBracket, lowerBracket);

  // ── CABLE — lives inside grip group (matches original) ───────────────────
  // Entering from the left, contacting the jaw, then immediately pulling
  // hard LEFT so it clears the finger geometry before drooping down.
  // Extended further down so it visually reaches the bottom form area.
  function buildCable(t) {
    const sway1 = Math.sin(t * 0.40) * 0.15;
    const sway2 = Math.sin(t * 0.62 + 1.2) * 0.12;
    const sway3 = Math.sin(t * 0.35 + 2.5) * 0.10;

    const pts = [
      new THREE.Vector3(-3.5,   0.35 + sway1 * 0.3,   0),
      new THREE.Vector3(-2.2,   0.12 + sway2 * 0.2,   sway1 * 0.15),
      new THREE.Vector3(-0.30,  0.00,                  0),                        // jaw contact
      new THREE.Vector3(-0.90, -0.15,                  0),                        // pull hard left — clears fingers
      new THREE.Vector3(-1.30, -0.70 + sway3 * 0.15,  sway2 * 0.08),
      new THREE.Vector3(-1.20 + sway1 * 0.10, -1.60,  sway3 * 0.12),
      new THREE.Vector3(-1.00 + sway2 * 0.08, -2.50,  sway1 * 0.08),
      new THREE.Vector3(-0.60 + sway3 * 0.06, -3.80,  sway2 * 0.06),
      new THREE.Vector3(-0.20,                -5.20,   0),                        // enters form area
    ];
    return {
      geom:     new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.072, 12, false),
      glowGeom: new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.18,   8, false),
      tip: pts[pts.length - 1],
    };
  }

  // Warm red point light at jaw contact
  const jawLight = new THREE.PointLight(0xFF3300, 5, 6);
  grip.add(jawLight);
  jawLight.position.set(-0.30, 0, 0);

  const initC     = buildCable(0);
  const cableMesh = new THREE.Mesh(initC.geom,     MAT.cable);
  const cableGlow = new THREE.Mesh(initC.glowGeom, MAT.cableGlow);
  grip.add(cableGlow, cableMesh);

  // Connector cap at the bottom
  const endSphere  = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), MAT.cableEnd);
  const endGlowMat = new THREE.MeshBasicMaterial({
    color: 0xFF0000, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const endGlow = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), endGlowMat);
  grip.add(endSphere, endGlow);

  // ── PARTICLES ─────────────────────────────────────────────────────────────
  const N = 100;
  const pPos = new Float32Array(N * 3);
  const pVel = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pPos[i*3]   = (Math.random()-0.5) * 22;
    pPos[i*3+1] = (Math.random()-0.5) * 18;
    pPos[i*3+2] = (Math.random()-0.5) * 8 - 2;
    pVel[i*3]   = (Math.random()-0.5) * 0.0010;
    pVel[i*3+1] = (Math.random()-0.5) * 0.0010;
  }
  const pGeom = new THREE.BufferGeometry();
  pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  scene.add(new THREE.Points(pGeom, new THREE.PointsMaterial({
    color: 0xBBB0A0, size: 0.015, transparent: true, opacity: 0.30, sizeAttenuation: true,
  })));

  // ── MOUSE ─────────────────────────────────────────────────────────────────
  let mx = 0, my = 0, curRY = 0, curRX = 0;
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth  - 0.5) * 2;
    my = (e.clientY / innerHeight - 0.5) * 2;
  });
  window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
  });

  // ── ANIME.JS DRIVEN STATE ─────────────────────────────────────────────────
  const GRIP_BASE_Y = 1.2;

  // 1. Camera entrance — swoops from far to final in one smooth arc
  const camState = { x: -4.0, y: 4.0, z: 28.0 };
  anime({
    targets: camState,
    x: -3.0, y: 2.5, z: 16.0,
    duration: 2200,
    easing: 'cubicBezier(0.16, 1, 0.3, 1)',
  });

  // 2. Jaw clamp — snappy open / close loop with elastic easing on close
  const jawState = { openAmt: 0 };
  const maxOpen = gapOpen - gapClosed;

  function scheduleJaw() {
    // Snap open fast, hold, clamp shut with overshoot, hold, repeat
    anime.timeline({ complete: scheduleJaw })
      .add({ targets: jawState, openAmt: maxOpen, duration: 420, easing: 'easeOutBack' })
      .add({ targets: jawState, openAmt: maxOpen, duration: 600, easing: 'linear' }) // hold open
      .add({ targets: jawState, openAmt: 0,       duration: 380, easing: 'easeInBack' })
      .add({ targets: jawState, openAmt: 0,       duration: 900, easing: 'linear' }); // hold closed
  }
  scheduleJaw();

  // 3. Float — continuous vertical bob via anime (infinite loop)
  const floatState = { y: GRIP_BASE_Y };
  anime({
    targets: floatState,
    y: [GRIP_BASE_Y - 0.18, GRIP_BASE_Y + 0.18],
    duration: 2800,
    direction: 'alternate',
    loop: true,
    easing: 'easeInOutSine',
  });

  // 4. Slow idle Y-rotation drift (on top of mouse)
  const driftState = { ry: -0.18 };
  anime({
    targets: driftState,
    ry: 0.18,
    duration: 5000,
    direction: 'alternate',
    loop: true,
    easing: 'easeInOutQuad',
  });

  // 5. Cable emissive pulse — makes it feel live / energized
  const pulseState = { intensity: 0.6 };
  anime({
    targets: pulseState,
    intensity: [0.7, 1.4],
    duration: 1100,
    direction: 'alternate',
    loop: true,
    easing: 'easeInOutSine',
  });

  // 6. End-glow opacity breathe
  const glowState = { opacity: 0.18 };
  anime({
    targets: glowState,
    opacity: [0.08, 0.30],
    duration: 1400,
    direction: 'alternate',
    loop: true,
    easing: 'easeInOutSine',
  });

  // ── RENDER LOOP ───────────────────────────────────────────────────────────
  let tick = 0;
  const CAM_LOOK = new THREE.Vector3(0.3, -0.8, 0);

  (function loop() {
    requestAnimationFrame(loop);
    tick += 0.016;

    // Camera — driven by anime
    cam.position.set(camState.x, camState.y, camState.z);
    cam.lookAt(CAM_LOOK);

    // Jaws — driven by anime jawState
    const openAmt = jawState.openAmt;
    const upperY  = gapClosed + openAmt;
    const lowerY  = -(gapClosed + openAmt);

    upperFinger.position.y   = upperY + fingerH;
    upperGripFace.position.y = upperY + 0.035;
    upperBracket.position.y  = upperY + fingerH * 0.55;

    lowerFinger.position.y   = lowerY - fingerH;
    lowerGripFace.position.y = lowerY - 0.035;
    lowerBracket.position.y  = lowerY - fingerH * 0.55;

    // Cable — local to grip group, same as original
    const cable = buildCable(tick);
    cableMesh.geometry.dispose();
    cableGlow.geometry.dispose();
    cableMesh.geometry = cable.geom;
    cableGlow.geometry = cable.glowGeom;

    MAT.cable.emissiveIntensity = pulseState.intensity;

    endSphere.position.copy(cable.tip);
    endGlow.position.copy(cable.tip);
    endGlowMat.opacity = glowState.opacity;

    cableGlowLight.position.set(cable.tip.x, cable.tip.y + 0.3, cable.tip.z + 0.5);

    // Mouse look — smooth lag
    curRY += (mx * 0.20 + driftState.ry - curRY) * 0.028;
    curRX += (-my * 0.08 - curRX) * 0.028;
    grip.rotation.y = curRY;
    grip.rotation.x = curRX;

    // Float — driven by anime
    grip.position.y = floatState.y;

    // Particles
    const attr = pGeom.attributes.position;
    for (let i = 0; i < N; i++) {
      attr.array[i*3]   += pVel[i*3];
      attr.array[i*3+1] += pVel[i*3+1];
      if (Math.abs(attr.array[i*3])   > 11) pVel[i*3]   *= -1;
      if (Math.abs(attr.array[i*3+1]) > 9)  pVel[i*3+1] *= -1;
    }
    attr.needsUpdate = true;

    renderer.render(scene, cam);
  })();

  } // end THREE guard
  </script>

</body>
</html>
