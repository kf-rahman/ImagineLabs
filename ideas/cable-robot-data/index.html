<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CableData — Training Data for Robotic Cable Manipulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F2EDE8; width: 100vw; height: 100vh;
      overflow: hidden; font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; }

    .logo {
      position: fixed; top: 28px; left: 32px; z-index: 10;
      font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.05em;
      color: rgba(0,0,0,0.30); text-decoration: none; transition: color .2s;
    }
    .logo:hover { color: rgba(0,0,0,0.55); }

    .headline-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; text-align: center;
      padding: 80px 32px 60px;
      background: linear-gradient(to top, transparent 0%, rgba(242,237,232,0.70) 40%, rgba(242,237,232,0.97) 80%);
      opacity: 0;
      animation: fadeDown .9s cubic-bezier(0.22,1,0.36,1) 1s forwards;
    }
    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-12px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .overlay {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 110px 32px 52px;
      background: linear-gradient(to bottom, transparent 0%, rgba(242,237,232,0.72) 30%, rgba(242,237,232,0.97) 58%);
      gap: 14px; opacity: 0;
      animation: fadeUp .9s cubic-bezier(0.22,1,0.36,1) 1s forwards;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    h1 {
      font-family: 'DM Mono', monospace; font-size: clamp(22px, 3vw, 42px);
      font-weight: 400; color: #1A1A1A; letter-spacing: -0.025em; line-height: 1.2;
    }
    p.sub { font-size: 14px; color: rgba(0,0,0,0.40); letter-spacing: 0.01em; }
    form { display: flex; gap: 8px; margin-top: 6px; }
    input[type="email"] {
      width: 230px; height: 44px; padding: 0 16px;
      background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.12);
      border-radius: 6px; color: #1A1A1A;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: background .15s, border-color .15s;
    }
    input::placeholder { color: rgba(0,0,0,0.28); }
    input:focus { background: rgba(0,0,0,0.06); border-color: rgba(0,50,200,0.50); }
    button {
      height: 44px; padding: 0 22px; background: #1A1A1A; color: #F2EDE8;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      border: none; border-radius: 6px; cursor: pointer; white-space: nowrap;
      transition: background .15s, transform .1s;
    }
    button:hover  { background: #333; }
    button:active { transform: scale(.97); }
    .success { display: none; align-items: center; gap: 10px; animation: fadeUp .35s ease forwards; }
    .success.show { display: flex; }
    .ring {
      width: 34px; height: 34px; border-radius: 50%; background: #1A1A1A;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .ring svg { stroke: #F2EDE8; }
    .success p { font-size: 14px; color: rgba(0,0,0,.45); }
    footer {
      position: fixed; bottom: 18px; right: 24px; z-index: 10;
      font-size: 11px; color: rgba(0,0,0,.15); font-family: 'DM Mono', monospace;
    }
    @media (max-width: 600px) {
      form { flex-direction: column; width: 100%; max-width: 300px; }
      input[type="email"] { width: 100%; }
    }
  </style>
</head>
<body>

  <a class="logo" href="#">cabledata</a>
  <canvas id="c"></canvas>

  <div class="headline-top">
    <h1>The missing dataset<br>for cable manipulation.</h1>
  </div>

  <div class="overlay">
    <p class="sub">We're building it. Join us early.</p>
    <form id="wl" novalidate>
      <input type="email" id="em" placeholder="you@company.com" autocomplete="email" />
      <button type="submit">Join us</button>
    </form>
    <div class="success" id="ok">
      <div class="ring">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2,7 5.5,10.5 12,3.5"/>
        </svg>
      </div>
      <p>You're on the list. We'll be in touch.</p>
    </div>
  </div>

  <footer>© 2025 CableData</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <script>
  if (typeof THREE === 'undefined') {
    document.getElementById('c').style.display = 'none';
    console.error('Three.js failed to load');
  }

  document.getElementById('wl').addEventListener('submit', async e => {
    e.preventDefault();
    const v = document.getElementById('em').value.trim();
    if (!v || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return;
    const btn = e.target.querySelector('button');
    btn.textContent = '...'; btn.disabled = true;
    await new Promise(r => setTimeout(r, 600));
    e.target.style.display = 'none';
    document.getElementById('ok').classList.add('show');
  });

  if (typeof THREE !== 'undefined') {

  // ── RENDERER ──────────────────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  const BG = 0xF2EDE8;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.FogExp2(BG, 0.006);

  // ── CAMERA ────────────────────────────────────────────────────────────────
  const cam = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 80);
  cam.position.set(-4.0, 4.0, 28.0);
  cam.lookAt(0, 0, 0);

  // ── LIGHTS — warm, soft, studio-like for the cream background ────────────
  scene.add(new THREE.AmbientLight(0xffffff, 1.8));

  const key = new THREE.DirectionalLight(0xFFF8F0, 6);
  key.position.set(5, 10, 8);
  scene.add(key);

  const fill = new THREE.PointLight(0xE8DDD0, 4, 30);
  fill.position.set(-8, 2, 6);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xDDDDEE, 3);
  rim.position.set(-3, 6, -8);
  scene.add(rim);

  // Accent light on cable
  const cableGlowLight = new THREE.PointLight(0x2244CC, 3, 8);
  scene.add(cableGlowLight);

  // ── MATERIALS — dark gripper on light background ──────────────────────────
  const MAT = {
    frame: new THREE.MeshStandardMaterial({
      color: 0x1C1C24, metalness: 0.90, roughness: 0.10,
    }),
    body: new THREE.MeshStandardMaterial({
      color: 0x28282F, metalness: 0.82, roughness: 0.18,
    }),
    gripFace: new THREE.MeshStandardMaterial({
      color: 0xDDDDE8, metalness: 0.10, roughness: 0.65,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -8,
    }),
    bolt: new THREE.MeshStandardMaterial({
      color: 0x111118, metalness: 0.95, roughness: 0.05,
    }),
    cable: new THREE.MeshStandardMaterial({
      color: 0xCC2222, metalness: 0.0, roughness: 0.50,
      emissive: new THREE.Color(0x661111), emissiveIntensity: 0.3,
    }),
    cableEnd: new THREE.MeshStandardMaterial({
      color: 0xDD3333,
      emissive: new THREE.Color(0xAA2222), emissiveIntensity: 0.5,
    }),
  };

  // ── HELPERS ───────────────────────────────────────────────────────────────
  function mkBox(w, h, d, mat, x, y, z) {
    x=x||0; y=y||0; z=z||0;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); return m;
  }
  function mkCyl(rt, rb, h, seg, mat, x, y, z, rx, ry, rz) {
    x=x||0; y=y||0; z=z||0; rx=rx||0; ry=ry||0; rz=rz||0;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m;
  }
  // Triangular/wedge prism: ExtrudeGeometry for the finger shape
  function mkWedge(length, height, depth, mat) {
    const shape = new THREE.Shape();
    // Triangle in XY plane: flat base on top, point at bottom
    shape.moveTo(-length/2, 0);
    shape.lineTo( length/2, 0);
    shape.lineTo( 0, -height);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: depth,
      bevelEnabled: false,
    });
    // Center the extrusion in Z
    geo.translate(0, 0, -depth/2);
    return new THREE.Mesh(geo, mat);
  }

  // ── GRIPPER ───────────────────────────────────────────────────────────────
  const grip = new THREE.Group();
  grip.scale.set(1.6, 1.6, 1.6);
  scene.add(grip);

  // ─── FRAME / ARM (extends RIGHT, off-screen) ─────────────────────────
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8,  0.55, -0.32));
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8, -0.55, -0.32));
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8,  0.55,  0.32));
  grip.add(mkBox(5.5, 0.18, 0.22, MAT.frame,  2.8, -0.55,  0.32));

  // Cross braces
  grip.add(mkBox(0.16, 1.26, 0.74, MAT.frame,  1.5,  0, 0));
  grip.add(mkBox(0.16, 1.26, 0.74, MAT.frame,  2.8,  0, 0));
  grip.add(mkBox(0.16, 1.26, 0.74, MAT.frame,  4.1,  0, 0));

  // Actuator housing
  grip.add(mkBox(1.30, 1.40, 0.95, MAT.body,  0.50, 0, 0));
  // Bolts
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.05,  0.50, 0.52));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.95,  0.50, 0.52));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.05, -0.50, 0.52));
  grip.add(mkCyl(0.05, 0.05, 0.14, 8, MAT.bolt,  0.95, -0.50, 0.52));

  // ─── TRIANGULAR FINGER PADS ──────────────────────────────────────────
  // Each finger is a wedge/triangle: wide at the mounting end, tapering
  // to a point at the gripping tip. This makes the shape immediately
  // readable as "clipper jaws."
  //
  //  Upper finger (wedge points DOWN toward cable):
  //
  //    ┌──────────────────┐  ← flat mounting edge (top)
  //    \                  /
  //      \              /
  //        \          /
  //          \  tip  /       ← pointed gripping edge
  //            ────
  //         [cable here]
  //            ────
  //          /  tip  \       ← pointed gripping edge
  //        /          \
  //      /              \
  //    /                  \
  //    └──────────────────┘  ← flat mounting edge (bottom)
  //
  //  Lower finger (wedge points UP toward cable):

  const fingerLen  = 1.80;  // width of the flat base
  const fingerH    = 0.70;  // height from base to tip
  const fingerD    = 1.10;  // depth (Z, front to back)
  const gapClosed  = 0.12;  // half-gap when fully closed (tips nearly touching)
  const gapOpen    = 0.55;  // half-gap when fully open

  // Upper finger — base at top, point faces DOWN toward cable
  // When closed, tip is at y = gapClosed. Base is at y = gapClosed + fingerH.
  const upperFinger = mkWedge(fingerLen, fingerH, fingerD, MAT.body);
  upperFinger.position.set(-0.30, gapClosed + fingerH, 0);  // base at top, tip at y=gapClosed
  grip.add(upperFinger);

  // Grip face strip on the upper finger tip
  const upperGripFace = mkBox(fingerLen * 0.45, 0.07, fingerD + 0.02, MAT.gripFace);
  upperGripFace.position.set(-0.30, gapClosed + 0.035, 0);
  grip.add(upperGripFace);

  // Lower finger — rotated 180° so base is at bottom, point faces UP toward cable
  // When closed, tip is at y = -gapClosed. Base is at y = -(gapClosed + fingerH).
  const lowerFinger = mkWedge(fingerLen, fingerH, fingerD, MAT.body);
  lowerFinger.rotation.z = Math.PI;
  lowerFinger.position.set(-0.30, -(gapClosed + fingerH), 0);  // base at bottom, tip at y=-gapClosed
  grip.add(lowerFinger);

  // Grip face strip on the lower finger tip
  const lowerGripFace = mkBox(fingerLen * 0.45, 0.07, fingerD + 0.02, MAT.gripFace);
  lowerGripFace.position.set(-0.30, -(gapClosed + 0.035), 0);
  grip.add(lowerGripFace);

  // Mounting brackets (connect each finger to the actuator housing)
  const upperBracket = mkBox(0.30, 0.35, fingerD + 0.16, MAT.frame,  0.40, gapClosed + fingerH * 0.55, 0);
  const lowerBracket = mkBox(0.30, 0.35, fingerD + 0.16, MAT.frame,  0.40, -(gapClosed + fingerH * 0.55), 0);
  grip.add(upperBracket);
  grip.add(lowerBracket);

  // ─── CABLE ────────────────────────────────────────────────────────────
  // Red cable (matches reference) enters from left, through the grip, droops down.
  function buildCable(t) {
    const sway1 = Math.sin(t * 0.40) * 0.15;
    const sway2 = Math.sin(t * 0.62 + 1.2) * 0.12;
    const sway3 = Math.sin(t * 0.35 + 2.5) * 0.10;

    const pts = [
      new THREE.Vector3(-3.5,   0.35 + sway1 * 0.3,   0),
      new THREE.Vector3(-2.2,   0.12 + sway2 * 0.2,   sway1 * 0.15),
      new THREE.Vector3(-0.30,  0.00,                  0),         // grip point (between jaws)
      new THREE.Vector3(-0.90, -0.15,                  0),         // pull hard left immediately
      new THREE.Vector3(-1.30, -0.70 + sway3 * 0.15,  sway2 * 0.08), // well clear of housing
      new THREE.Vector3(-1.20 + sway1 * 0.10, -1.60,  sway3 * 0.12),
      new THREE.Vector3(-1.00 + sway2 * 0.08, -2.50,  sway1 * 0.08),
      new THREE.Vector3(-0.80,                 -3.50,  0),
    ];
    return {
      geom: new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, 0.055, 10, false),
      tip: pts[pts.length - 1],
    };
  }

  const endSphere   = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), MAT.bolt);
  const innerSphere = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), MAT.cableEnd);
  const initC = buildCable(0);
  endSphere.position.copy(initC.tip);
  innerSphere.position.copy(initC.tip);
  const cableMesh = new THREE.Mesh(initC.geom, MAT.cable);
  grip.add(cableMesh, endSphere, innerSphere);

  // ── PARTICLES (subtle, warm-toned for light bg) ───────────────────────────
  const N = 100;
  const pPos = new Float32Array(N * 3);
  const pVel = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pPos[i*3]   = (Math.random()-0.5) * 22;
    pPos[i*3+1] = (Math.random()-0.5) * 18;
    pPos[i*3+2] = (Math.random()-0.5) * 8 - 2;
    pVel[i*3]   = (Math.random()-0.5) * 0.0010;
    pVel[i*3+1] = (Math.random()-0.5) * 0.0010;
  }
  const pGeom = new THREE.BufferGeometry();
  pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  scene.add(new THREE.Points(pGeom, new THREE.PointsMaterial({
    color: 0xBBB0A0, size: 0.015, transparent: true, opacity: 0.30, sizeAttenuation: true,
  })));

  // ── MOUSE ─────────────────────────────────────────────────────────────────
  let mx = 0, my = 0, curRY = 0, curRX = 0;
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth  - 0.5) * 2;
    my = (e.clientY / innerHeight - 0.5) * 2;
  });

  window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
  });

  // ── RENDER LOOP ───────────────────────────────────────────────────────────
  const GRIP_BASE_Y = 1.2;
  let tick = 0;

  const CAM_FINAL = { x: -3.0, y: 2.5, z: 16.0 };
  const CAM_LOOK  = new THREE.Vector3(0.3, -0.8, 0);

  (function loop() {
    requestAnimationFrame(loop);
    tick += 0.016;

    // Camera entrance
    cam.position.x += (CAM_FINAL.x - cam.position.x) * 0.014;
    cam.position.y += (CAM_FINAL.y - cam.position.y) * 0.014;
    cam.position.z += (CAM_FINAL.z - cam.position.z) * 0.014;
    cam.lookAt(CAM_LOOK);

    // ── CLIPPING ANIMATION ──────────────────────────────────────────────
    // The jaws open and close in a slow, smooth cycle.
    // jawExtra: 0 = closed position, (gapOpen - gapClosed) = fully open
    const clipCycle = tick * 0.45;
    const openAmt   = (Math.sin(clipCycle) * 0.5 + 0.5)   // 0→1 smooth
                      * (gapOpen - gapClosed);             // max extra opening

    const upperY = gapClosed + openAmt;
    const lowerY = -(gapClosed + openAmt);

    // Move upper finger + grip face + bracket
    upperFinger.position.y   = upperY + fingerH;
    upperGripFace.position.y = upperY + 0.035;
    upperBracket.position.y  = upperY + fingerH * 0.55;

    // Move lower finger + grip face + bracket
    lowerFinger.position.y   = lowerY - fingerH;
    lowerGripFace.position.y = lowerY - 0.035;
    lowerBracket.position.y  = lowerY - fingerH * 0.55;

    // Cable animation
    const cable = buildCable(tick);
    cableMesh.geometry.dispose();
    cableMesh.geometry = cable.geom;
    endSphere.position.copy(cable.tip);
    innerSphere.position.copy(cable.tip);

    cableGlowLight.position.set(
      cable.tip.x * 1.6,
      cable.tip.y * 1.6 + GRIP_BASE_Y + 0.3,
      cable.tip.z * 1.6 + 0.6
    );

    // Mouse rotation
    curRY += (mx * 0.20 - curRY) * 0.022;
    curRX += (-my * 0.08 - curRX) * 0.022;
    grip.rotation.y = curRY;
    grip.rotation.x = curRX;

    // Float
    grip.position.y = Math.sin(tick * 0.32) * 0.04 + GRIP_BASE_Y;

    // Particles
    const attr = pGeom.attributes.position;
    for (let i = 0; i < N; i++) {
      attr.array[i*3]   += pVel[i*3];
      attr.array[i*3+1] += pVel[i*3+1];
      if (Math.abs(attr.array[i*3])   > 11) pVel[i*3]   *= -1;
      if (Math.abs(attr.array[i*3+1]) > 9)  pVel[i*3+1] *= -1;
    }
    attr.needsUpdate = true;

    renderer.render(scene, cam);
  })();

  } // end THREE guard
  </script>

</body>
</html>
